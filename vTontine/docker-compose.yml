# Si tu n'as pas encore installer keycloak, tu decommnetes ce que j'ai mis en commentaire dans ce fichier et tu lances `docker-compose up` pour que keycloak soit installé et configuré automatiquement.
version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: tontine_postgres
    environment:
      POSTGRES_DB: tontine_db
      POSTGRES_USER: tontine_user
      POSTGRES_PASSWORD: Jdk@Delwende#1
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: tontine_keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_keycloak:5432/keycloak_db
      KC_DB_USERNAME: tontine_user
      KC_DB_PASSWORD: tontine_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres_keycloak

  postgres_keycloak:
    image: postgres:15
    container_name: keycloak_postgres
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: tontine_user
      POSTGRES_PASSWORD: tontine_password
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  keycloak_postgres_data: